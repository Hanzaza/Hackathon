# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION
# Entregable 3: Recibe todo el tráfico público (puerto 80).
# NUNCA expone los puertos 3000 (frontend) ni 4000 (backend) directamente a internet.
# ==============================================================================

upstream frontend_upstream {
    server frontend:3000;
    keepalive 32;
}

upstream backend_upstream {
    server backend:4000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Tamaño máximo de subida para fotos y archivos
    client_max_body_size 50M;

    # Encabezados de seguridad HTTP básicos
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. API REST Backend (Rutas /api/...)
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts de conexión seguros
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 2. Healthcheck directo
    location /health {
        proxy_pass http://backend_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. Frontend Next.js (Todo el tráfico web restante)
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;

        # Soporte para WebSockets y Server-Sent Events
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
