<svg width="390" height="844" xmlns="http://www.w3.org/2000/svg" style="background: #0F3A2E; font-family: sans-serif;">
  <defs>
    <!-- Mandala pattern derived from ROOTS logo -->
    <pattern id="roots-mandala" width="130" height="130" patternUnits="userSpaceOnUse">
      <!-- 8 Petal Loops -->
      <circle cx="65" cy="65" r="58" fill="none" stroke="#00A8A7" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.3" />
      
      <!-- Central intertwined knot -->
      <rect x="53" y="53" width="24" height="24" fill="none" stroke="#00A8A7" stroke-width="2" rx="4" />
      <rect x="53" y="53" width="24" height="24" transform="rotate(45 65 65)" fill="none" stroke="#00A8A7" stroke-width="2" rx="4" />
      
      <!-- Petal loops pointing to 8 directions -->
      <!-- Top -->
      <path d="M 57,44 C 45,28 50,10 65,8 C 80,10 85,28 73,44" fill="none" stroke="#00A8A7" stroke-width="2.4" stroke-linecap="round" />
      <!-- Bottom -->
      <path d="M 57,86 C 45,102 50,120 65,122 C 80,120 85,102 73,86" fill="none" stroke="#00A8A7" stroke-width="2.4" stroke-linecap="round" />
      <!-- Left -->
      <path d="M 44,57 C 28,45 10,50 8,65 C 10,80 28,85 44,73" fill="none" stroke="#00A8A7" stroke-width="2.4" stroke-linecap="round" />
      <!-- Right -->
      <path d="M 86,57 C 102,45 120,50 122,65 C 120,80 102,85 86,73" fill="none" stroke="#00A8A7" stroke-width="2.4" stroke-linecap="round" />
      
      <!-- 4 Diagonals -->
      <path d="M 74,44 C 84,28 102,28 110,38 C 118,48 114,64 96,68" fill="none" stroke="#00A8A7" stroke-width="2.2" stroke-linecap="round" />
      <path d="M 44,74 C 28,84 28,102 38,110 C 48,118 64,114 68,96" fill="none" stroke="#00A8A7" stroke-width="2.2" stroke-linecap="round" />
      <path d="M 74,86 C 84,102 102,102 110,92 C 118,82 114,66 96,62" fill="none" stroke="#00A8A7" stroke-width="2.2" stroke-linecap="round" />
      <path d="M 44,56 C 28,46 28,28 38,20 C 48,12 64,16 68,34" fill="none" stroke="#00A8A7" stroke-width="2.2" stroke-linecap="round" />

      <!-- Center sun -->
      <circle cx="65" cy="65" r="5" fill="#00A8A7" fill-opacity="0.8" />
      
      <!-- Corner interconnecting rings -->
      <circle cx="0" cy="0" r="16" fill="none" stroke="#00A8A7" stroke-width="1.8" opacity="0.4" />
      <circle cx="130" cy="0" r="16" fill="none" stroke="#00A8A7" stroke-width="1.8" opacity="0.4" />
      <circle cx="0" cy="130" r="16" fill="none" stroke="#00A8A7" stroke-width="1.8" opacity="0.4" />
      <circle cx="130" cy="130" r="16" fill="none" stroke="#00A8A7" stroke-width="1.8" opacity="0.4" />
    </pattern>
    
    <!-- Radial ambient vignette -->
    <radialGradient id="ambient-glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#00A8A7" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#0F3A2E" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#071F18" stop-opacity="0.95" />
    </radialGradient>
  </defs>

  <!-- Background Pattern -->
  <rect width="100%" height="100%" fill="url(#roots-mandala)" opacity="0.45" />
  <rect width="100%" height="100%" fill="url(#ambient-glow)" />

  <!-- Central Emblem Placeholder -->
  <circle cx="195" cy="320" r="85" fill="white" fill-opacity="0.08" stroke="white" stroke-width="2" stroke-opacity="0.3" />
  
  <!-- ROOTS Typography -->
  <text x="195" y="450" fill="white" font-size="38" font-weight="900" letter-spacing="8" text-anchor="middle">ROOTS</text>
  <text x="195" y="475" fill="#00A8A7" font-size="12" font-weight="700" letter-spacing="3" text-anchor="middle">CIUDADES CREATIVAS</text>

  <!-- 5 Cultural Icons Dock at bottom -->
  <g transform="translate(195, 600)">
    <text x="0" y="-30" fill="rgba(255,255,255,0.7)" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">PATRIMONIO &amp; IDENTIDAD</text>
  </g>
</svg>