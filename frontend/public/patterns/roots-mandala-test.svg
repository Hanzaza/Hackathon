<svg width="480" height="480" xmlns="http://www.w3.org/2000/svg" style="background: #0F3A2E">
  <defs>
    <pattern id="roots-mandala-pattern" width="160" height="160" patternUnits="userSpaceOnUse">
      <!-- Outer circle of the rosette -->
      <circle cx="80" cy="80" r="74" fill="none" stroke="#00A8A7" stroke-width="2" stroke-dasharray="4 3" opacity="0.4" />
      
      <!-- 8 Petal Loops of the ROOTS emblem -->
      <path d="M 70.0,54.0 C 56.0,35.0 62.0,12.0 80.0,10.0 C 98.0,12.0 104.0,35.0 90.0,54.0" fill="none" stroke="#00A8A7" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 91.3,54.5 C 94.8,31.2 115.4,19.2 129.5,30.5 C 140.8,44.6 128.8,65.2 105.5,68.7" fill="none" stroke="#00A8A7" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 106.0,70.0 C 125.0,56.0 148.0,62.0 150.0,80.0 C 148.0,98.0 125.0,104.0 106.0,90.0" fill="none" stroke="#00A8A7" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 105.5,91.3 C 128.8,94.8 140.8,115.4 129.5,129.5 C 115.4,140.8 94.8,128.8 91.3,105.5" fill="none" stroke="#00A8A7" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 90.0,106.0 C 104.0,125.0 98.0,148.0 80.0,150.0 C 62.0,148.0 56.0,125.0 70.0,106.0" fill="none" stroke="#00A8A7" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 68.7,105.5 C 65.2,128.8 44.6,140.8 30.5,129.5 C 19.2,115.4 31.2,94.8 54.5,91.3" fill="none" stroke="#00A8A7" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 54.0,90.0 C 35.0,104.0 12.0,98.0 10.0,80.0 C 12.0,62.0 35.0,56.0 54.0,70.0" fill="none" stroke="#00A8A7" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 54.5,68.7 C 31.2,65.2 19.2,44.6 30.5,30.5 C 44.6,19.2 65.2,31.2 68.7,54.5" fill="none" stroke="#00A8A7" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Central intertwined square / diamond knot -->
      <rect x="66" y="66" width="28" height="28" fill="none" stroke="#00A8A7" stroke-width="2.2" rx="4" />
      <rect x="66" y="66" width="28" height="28" transform="rotate(45 80 80)" fill="none" stroke="#00A8A7" stroke-width="2.2" rx="4" />
      
      <!-- Center core dot / sun -->
      <circle cx="80" cy="80" r="6" fill="#00A8A7" fill-opacity="0.8" />
      <circle cx="80" cy="80" r="14" fill="none" stroke="#00A8A7" stroke-width="1.5" stroke-opacity="0.6" />
      
      <!-- Connecting corner links for seamless tiling -->
      <path d="M 0,0 L 20,20 M 160,0 L 140,20 M 0,160 L 20,140 M 160,160 L 140,140" stroke="#00A8A7" stroke-width="2" stroke-linecap="round" opacity="0.6" />
      <circle cx="0" cy="0" r="18" fill="none" stroke="#00A8A7" stroke-width="2" opacity="0.5" />
      <circle cx="160" cy="0" r="18" fill="none" stroke="#00A8A7" stroke-width="2" opacity="0.5" />
      <circle cx="0" cy="160" r="18" fill="none" stroke="#00A8A7" stroke-width="2" opacity="0.5" />
      <circle cx="160" cy="160" r="18" fill="none" stroke="#00A8A7" stroke-width="2" opacity="0.5" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#roots-mandala-pattern)" />
</svg>