# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION
# Entregable 3: Recibe todo el tráfico público (puerto 80).
# NUNCA expone los puertos 3000 (frontend) ni 4000 (backend) directamente a internet.
# ==============================================================================

upstream frontend_upstream {
    server frontend:3000;
    keepalive 32;
}

upstream backend_upstream {
    server backend:4000;
    keepalive 32;
}

# 1. Redirección obligatoria HTTP -> HTTPS (Puerto 80)
server {
    listen 80;
    listen [::]:80;
    server_name roots-nicaragua.mexicocentral.cloudapp.azure.com 158.23.21.55 _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Servidor Seguro HTTPS (Puerto 443) - Entregable 2 (Candado SSL Válido)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name roots-nicaragua.mexicocentral.cloudapp.azure.com 158.23.21.55 _;

    # Certificados SSL de Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/roots-nicaragua.mexicocentral.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roots-nicaragua.mexicocentral.cloudapp.azure.com/privkey.pem;

    # Protocolos y Cifrados Seguros Modernos
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Tamaño máximo de subida para fotos y archivos
    client_max_body_size 50M;

    # Encabezados de seguridad HTTP estrictos (HSTS y OWASP)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # A. API REST Backend (Rutas /api/...)
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # B. Healthcheck directo
    location /health {
        proxy_pass http://backend_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # C. Frontend Next.js (Todo el tráfico web restante)
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;

        # Soporte para WebSockets y Server-Sent Events
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
